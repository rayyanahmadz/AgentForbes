name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Test Edge Functions (Deno)
        run: |
          deno test supabase/functions/_shared/grounding.test.ts
          deno test supabase/functions/run-workflow/index.test.ts
          deno test supabase/functions/team-chat/index.test.ts
